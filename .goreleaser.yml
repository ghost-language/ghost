version: 2
project_name: ghost

before:
  hooks:
    # Fail on a missing or mismatched dependency before any build starts,
    # rather than once per GOOS/GOARCH pair.
    - go mod download

builds:
  - id: "cli"
    main: ./cmd
    binary: ghost
    env:
      - CGO_ENABLED=0
    goos: ["linux", "darwin", "windows"]
    goarch: ["386", "amd64", "arm", "arm64"]
    ignore:
      # macOS was never shipped for 32-bit Intel, and every Apple Silicon
      # machine is arm64. These two combinations build nothing installable.
      - goos: "darwin"
        goarch: "386"
      - goos: "darwin"
        goarch: "arm"
      # 32-bit ARM Windows is not a platform anyone runs a CLI on.
      - goos: "windows"
        goarch: "arm"
    flags:
      # Keeps the build machine's paths out of the binary, matching the
      # Makefile's build targets.
      - -trimpath
    ldflags:
      - -s -w
    # Stamp binaries with the commit time instead of the build time, so
    # rebuilding a tag produces the same archives.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: "cli"
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: ["tar.gz"]
    format_overrides:
      - goos: "windows"
        formats: ["zip"]
    files: ["LICENSE", "README.md"]

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^examples:"
      - "^test:"
      - '(?i)\breadme\b'

release:
  # The release already exists by the time this runs - a human created it on
  # GitHub, which is what triggers the workflow. Append the generated changelog
  # to whatever notes they wrote instead of replacing them.
  mode: append

brews:
  - name: ghost
    repository:
      owner: ghost-language
      name: homebrew-ghost
      # The tap is a separate repository, so the workflow's automatic
      # GITHUB_TOKEN cannot push to it. This needs a personal access token
      # with contents:write on ghost-language/homebrew-ghost, stored as the
      # HOMEBREW_TAP_TOKEN secret.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # Without the token the formula cannot be pushed. Skipping that one step is
    # better than failing a release whose binaries are already published.
    skip_upload: '{{ if .Env.HOMEBREW_TAP_TOKEN }}false{{ else }}true{{ end }}'
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    homepage: "https://github.com/ghost-language/ghost"
    description: "Ghost, a dynamically typed scripting language."
    license: "MIT"
    install: |
      bin.install "ghost"
    test: |
      assert_match version.to_s, shell_output("#{bin}/ghost -v")
